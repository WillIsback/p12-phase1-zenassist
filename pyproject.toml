[project]
name = "p12"
version = "0.1.0"
description = "Comparez des algorithmes d'IA entre Machine Learning et LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.8",
    "lightgbm>=4.6.0",
    "openai>=2.30.0",
    "pandas>=3.0.2",
    "requests>=2.33.1",
    "ruff>=0.15.9",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "torch>=2.11.0",
    "transformers>=5.5.0",
    "weave>=0.52.36",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
